<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Llama Gallery</title>
    <link rel="stylesheet" href="css/llama-gallery.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🦙 Random Llama Gallery</h1>
            <p class="subtitle">Discover a new adorable llama every time!</p>
        </div>

        <div class="error-message" id="errorMessage">
            <strong>Oops!</strong> Failed to load the llama image. Please try again.
        </div>

        <div class="image-container" id="imageContainer">
            <div class="loading-placeholder" id="loadingPlaceholder">
                <div class="spinner"></div>
                <p>Loading a beautiful llama...</p>
            </div>
            <img class="llama-image" id="llamaImage" alt="Random llama image">
        </div>

        <div class="controls">
            <button id="newLlamaBtn">🔄 New Llama</button>
            <button id="refreshBtn">↻ Refresh Page</button>
        </div>

        <div class="info">
            <p>Each llama is randomly selected from our curated collection to bring you joy! Click "New Llama" for another one, or refresh the page.</p>
            <div class="image-source" id="imageSource"></div>
        </div>
    </div>

    <script src="js/llama-gallery.js"></script>
</body>
</html>
