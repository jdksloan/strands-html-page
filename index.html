<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .controls {
            text-align: center;
            margin: 20px 0;
        }

        button {
            padding: 10px 20px;
            margin: 0 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        .content {
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .navigation {
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .nav-link {
            display: inline-block;
            padding: 12px 24px;
            margin: 0 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Hello World</h1>
        <p>This is a basic HTML page displaying "Hello World".</p>
        
        <div class="navigation">
            <h3>🎉 New Feature Available!</h3>
            <p>Check out our new random llama gallery:</p>
            <a href="llama.html" class="nav-link">🦙 Visit Llama Gallery</a>
        </div>
        
        <div class="controls">
            <button id="showSpinner">Show Spinner</button>
            <button id="hideSpinner" disabled>Hide Spinner</button>
        </div>
        
        <div class="spinner" id="spinner"></div>
        
        <p id="status">Click "Show Spinner" to see the loading animation!</p>
    </div>

    <script>
        // Get references to DOM elements
        const spinner = document.getElementById('spinner');
        const showBtn = document.getElementById('showSpinner');
        const hideBtn = document.getElementById('hideSpinner');
        const status = document.getElementById('status');

        // Function to show the spinner
        function showSpinner() {
            spinner.style.display = 'block';
            showBtn.disabled = true;
            hideBtn.disabled = false;
            status.textContent = 'Spinner is running... Click "Hide Spinner" to stop it.';
        }

        // Function to hide the spinner
        function hideSpinner() {
            spinner.style.display = 'none';
            showBtn.disabled = false;
            hideBtn.disabled = true;
            status.textContent = 'Spinner is hidden. Click "Show Spinner" to see it again!';
        }

        // Add event listeners to buttons
        showBtn.addEventListener('click', showSpinner);
        hideBtn.addEventListener('click', hideSpinner);

        // Optional: Auto-show spinner for 3 seconds when page loads
        window.addEventListener('load', function() {
            setTimeout(function() {
                showSpinner();
                // Auto-hide after 3 seconds for demo
                setTimeout(hideSpinner, 3000);
            }, 1000);
        });
    </script>
</body>
</html>
